name: HN Lead Agent V2

on:
  schedule:
    - cron: '*/15 * * * *'  # Fires every 15 min all month; lead_scraper.py's
                             # should_run_this_tick() decides whether a given
                             # tick actually does work (see module docstring).
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # Hard kill if something hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet boto3 requests

      - name: Run Lead Agent
        env:
          DEEPSEEK_API_KEY:        ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_URL:        "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
          DEEPSEEK_MODEL:          "deepseek-v4-pro-0813"
          DISCORD_WEBHOOK_URL:     ${{ secrets.DISCORD_WEBHOOK_URL }}
          B2_KEY_ID:               ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY:      ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME:          ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT:             ${{ secrets.B2_ENDPOINT }}
          MAX_ITEMS_PER_RUN:       "150"
          SHOW_HN_LOOKBACK_HOURS:  "6"
          LAUNCH_HN_LOOKBACK_HOURS: "48"
        run: python lead_scraper.py
